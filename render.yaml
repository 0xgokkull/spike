services:
  - type: web
    name: resolution-desk
    env: node
    plan: starter
    buildCommand: pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: resolution-desk-db
          property: connectionString
      - key: PAYPAL_MODE
        value: fake
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DEMO_MODE
        value: "true"

  - type: cron
    name: resolution-desk-sync
    env: node
    plan: starter
    schedule: "* * * * *"
    command: curl -s -X POST https://resolution-desk.onrender.com/api/sync

databases:
  - name: resolution-desk-db
    plan: starter
    databaseName: resolution_desk
    user: postgres

